name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          ./build.sh || true
          touch config.properties
          setkey() { sed -i "/^$1=/d" config.properties; echo "$1=$2" >> config.properties; }
          setkey city "Três Pontas"
          setkey latitude -21.3686
          setkey longitude -45.5128
          setkey tmdb_region BR
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: FreeMyTV.apk
