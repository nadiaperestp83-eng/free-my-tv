name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34"
          ./build.sh || true
          touch config.properties
          setkey() { sed -i "/^$1=/d" config.properties; echo "$1=$2" >> config.properties; }
          setkey city "Três Pontas"
          setkey latitude -21.3686
          setkey longitude -45.5128
          setkey tmdb_region BR
          if [ -n "$TMDB_KEY" ]; then setkey tmdb_key "$TMDB_KEY"; fi
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: FreeMyTV.apk
          retention-days: 1
